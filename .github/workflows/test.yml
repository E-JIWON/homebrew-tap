name: test

on:
  push:
  pull_request:
  workflow_dispatch:

# 러너 공용 IP 의 GitHub API 한도(60/시간)에 걸려 audit 이 실패하지 않게
env:
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

jobs:
  capywork:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use this checkout as e-jiwon/tap
        run: |
          TAP="$(brew --repository)/Library/Taps/e-jiwon/homebrew-tap"
          mkdir -p "$(dirname "$TAP")" && rm -rf "$TAP" && ln -s "$GITHUB_WORKSPACE" "$TAP"
      - run: brew install --build-from-source --verbose e-jiwon/tap/capywork
      - run: brew test e-jiwon/tap/capywork
      - run: brew audit --strict e-jiwon/tap/capywork
      - name: capywork-setup and --uninstall in a scratch home
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          capywork-setup
          jq -e '.hooks.Stop[0].hooks[0].command | contains(".capywork/hook.sh")' "$HOME/.claude/settings.json"
          grep -q "/opt/capywork/CapyWork.app" "$HOME/Library/LaunchAgents/com.capywork.plist"
          capywork-setup --uninstall
          jq -e '.hooks == null' "$HOME/.claude/settings.json"

  hugwatch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use this checkout as e-jiwon/tap
        run: |
          TAP="$(brew --repository)/Library/Taps/e-jiwon/homebrew-tap"
          mkdir -p "$(dirname "$TAP")" && rm -rf "$TAP" && ln -s "$GITHUB_WORKSPACE" "$TAP"
      - run: brew style --cask e-jiwon/tap/hugwatch
      - run: brew audit --cask --strict --online e-jiwon/tap/hugwatch
      - run: brew install --cask e-jiwon/tap/hugwatch
      - name: quarantine removed + selftest
        run: |
          test -d /Applications/HugWatch.app
          if xattr -p com.apple.quarantine /Applications/HugWatch.app 2>/dev/null; then echo "still quarantined"; exit 1; fi
          /Applications/HugWatch.app/Contents/MacOS/HugWatch --selftest
      - run: brew uninstall --cask e-jiwon/tap/hugwatch
